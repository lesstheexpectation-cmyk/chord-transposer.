<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Screenshot Transposer</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      background: #f8f9fa;
      color: #333;
    }
    h1 { margin-bottom: 5px; }
    .subtitle { color: #666; margin-bottom: 20px; }
    .controls {
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    label { font-weight: bold; }
    select, input[type="file"], button {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #999; cursor: not-allowed; }
    #status { font-weight: bold; color: #0066cc; width: 100%; margin-top: 5px; }
    
    .drop-zone {
      border: 2px dashed #0066cc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #f0f7ff;
      color: #0066cc;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .workspace {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .panel {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 320px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>Chord Screenshot Transposer</h1>
  <p class="subtitle">Paste a screenshot directly (Ctrl+V) or upload an image to transpose chords on lyrics.</p>

  <div class="drop-zone" id="dropZone">
    📋 Paste screenshot from clipboard (Ctrl+V / Cmd+V) or Drop Image Here
  </div>

  <div class="controls">
    <div>
      <label for="imageInput">Or select file:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div>
      <label for="semitones">Transpose:</label>
      <select id="semitones">
        <option value="-5">-5 semitones</option>
        <option value="-4">-4 semitones</option>
        <option value="-3">-3 semitones</option>
        <option value="-2">-2 semitones (-1 step)</option>
        <option value="-1">-1 semitone</option>
        <option value="0" selected>0 (Original Key)</option>
        <option value="1">+1 semitone</option>
        <option value="2">+2 semitones (+1 step)</option>
        <option value="3">+3 semitones</option>
        <option value="4">+4 semitones</option>
        <option value="5">+5 semitones</option>
      </select>
    </div>

    <button id="processBtn" disabled>Scan & Transpose</button>
    <div id="status"></div>
  </div>

  <div class="workspace">
    <div class="panel">
      <h3>Transposed Output</h3>
      <canvas id="outputCanvas"></canvas>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const semitonesSelect = document.getElementById('semitones');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;
    let detectedWords = [];

    // Robust Regex for roots, extensions, 7ths, dim, aug, sus, add, and slash chords (e.g. F/A, A/C#)
    const CHORD_REGEX = /^[A-G](b|#)?(m|maj|min|dim|aug|sus|add)?[0-9]?(\/[A-G](b|#)?)?$/i;

    function loadImageFromFile(file) {
      if (!file || !file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          processBtn.disabled = false;
          status.innerText = 'Image loaded. Click "Scan & Transpose".';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    imageInput.addEventListener('change', (e) => loadImageFromFile(e.target.files[0]));

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          loadImageFromFile(item.getAsFile());
          break;
        }
      }
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFromFile(e.dataTransfer.files[0]);
    });

    processBtn.addEventListener('click', async () => {
      if (!loadedImage) return;

      status.innerText = 'Analyzing chord structures...';
      processBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker(['eng', 'chi_sim', 'chi_tra']);
        status.innerText = 'Scanning image...';
        const ret = await worker.recognize(loadedImage);
        detectedWords = ret.data.words || [];
        await worker.terminate();

        status.innerText = 'Transposing chords...';
        renderTransposedCanvas();
        status.innerText = 'Done!';
      } catch (err) {
        console.error(err);
        status.innerText = 'Error processing image.';
      } finally {
        processBtn.disabled = false;
      }
    });

    semitonesSelect.addEventListener('change', () => {
      if (detectedWords.length > 0) renderTransposedCanvas();
    });

    // Fixed transposeNote function to handle Bb, Eb, Ab flat note lookups properly
    function transposeNote(note, shift) {
      const normNote = note.toUpperCase();
      const SHARPS_UPPER = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const FLATS_UPPER  = ['C', 'DB', 'D', 'EB', 'E', 'F', 'GB', 'G', 'AB', 'A', 'BB', 'B'];

      let index = SHARPS_UPPER.indexOf(normNote);
      if (index === -1) {
        index = FLATS_UPPER.indexOf(normNote);
      }
      if (index === -1) return note;

      let newIndex = (index + shift) % 12;
      if (newIndex < 0) newIndex += 12;

      return SHARPS_UPPER[newIndex];
    }

    function transposeChordToken(chord, shift) {
      return chord.replace(/([A-G][b#]?)/gi, (match) => transposeNote(match, shift));
    }

    function renderTransposedCanvas() {
      if (!loadedImage) return;

      ctx.drawImage(loadedImage, 0, 0);
      const shift = parseInt(semitonesSelect.value, 10);

      detectedWords.forEach(wordObj => {
        let rawText = wordObj.text.trim();
        
        // OCR cleanup fix (e.g., convert 'I' or '1' inside slash chords like A1C# to A/C#)
        rawText = rawText.replace(/([A-G][b#]?)[|I1l]([A-G])/g, '$1/$2');

        // Split squeezed tokens like |Bm|C|D| into separate pieces
        const tokens = rawText.split(/([|()\[\]\s]+)/);

        tokens.forEach(token => {
          const cleanToken = token.trim();
          if (cleanToken && CHORD_REGEX.test(cleanToken)) {
            const bbox = wordObj.bbox;
            const width = bbox.x1 - bbox.x0;
            const height = bbox.y1 - bbox.y0;

            // Cover original chord area with a white background block
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(bbox.x0 - 2, bbox.y0 - 2, width + 4, height + 4);

            // Transpose
            const transposed = (shift === 0) ? cleanToken : transposeChordToken(cleanToken, shift);

            // Render transposed chord text in bold red
            ctx.fillStyle = '#D32F2F';
            ctx.font = `bold ${Math.max(14, height)}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(transposed, bbox.x0, bbox.y0);
          }
        });
      });
    }
  </script>
</body>
</html>
