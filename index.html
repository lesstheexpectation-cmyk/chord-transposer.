<script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const semitonesSelect = document.getElementById('semitones');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;
    let detectedWords = [];

    // Music Theory Definitions
    const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const FLATS  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
    
    // Improved Regex to recognize 7ths, dim, aug, sus, add, and slash chords!
    const CHORD_REGEX = /^[A-G](b|#)?(m|maj|min|dim|aug|sus|add)?[0-9]?(\/[A-G](b|#)?)?$/i;

    function loadImageFromFile(file) {
      if (!file || !file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          processBtn.disabled = false;
          status.innerText = 'Image loaded. Click "Scan & Transpose".';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    imageInput.addEventListener('change', (e) => loadImageFromFile(e.target.files[0]));

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          loadImageFromFile(item.getAsFile());
          break;
        }
      }
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFromFile(e.dataTransfer.files[0]);
    });

    processBtn.addEventListener('click', async () => {
      if (!loadedImage) return;

      status.innerText = 'Scanning image (first run may take a few seconds)...';
      processBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker(['eng', 'chi_sim', 'chi_tra']);
        status.innerText = 'Scanning image...';
        const ret = await worker.recognize(loadedImage);
        detectedWords = ret.data.words;
        await worker.terminate();

        status.innerText = 'Transposing chords...';
        renderTransposedCanvas();
        status.innerText = 'Done!';
      } catch (err) {
        console.error(err);
        status.innerText = 'Error processing image.';
      } finally {
        processBtn.disabled = false;
      }
    });

    semitonesSelect.addEventListener('change', () => {
      if (detectedWords.length > 0) renderTransposedCanvas();
    });

    function transposeNote(note, shift) {
      let scale = SHARPS;
      let index = scale.indexOf(note.toUpperCase());
      if (index === -1) {
        scale = FLATS;
        index = scale.indexOf(note.toUpperCase());
      }
      if (index === -1) return note;

      let newIndex = (index + shift) % 12;
      if (newIndex < 0) newIndex += 12;
      return scale[newIndex];
    }

    function transposeChordToken(chord, shift) {
      return chord.replace(/([A-G][b#]?)/gi, (match) => transposeNote(match, shift));
    }

    function renderTransposedCanvas() {
      if (!loadedImage) return;

      ctx.drawImage(loadedImage, 0, 0);
      const shift = parseInt(semitonesSelect.value, 10);

      detectedWords.forEach(wordObj => {
        const text = wordObj.text.trim();
        
        // Strip out common musical symbols like |, (, ), [, ], : from the text
        const cleanedText = text.replace(/[|()\[\]:]/g, '').trim();

        if (cleanedText && CHORD_REGEX.test(cleanedText)) {
          const bbox = wordObj.bbox;
          const width = bbox.x1 - bbox.x0;
          const height = bbox.y1 - bbox.y0;

          // Clear original region with a white cover
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(bbox.x0 - 2, bbox.y0 - 2, width + 4, height + 4);

          // Transpose chord token
          const transposed = (shift === 0) ? cleanedText : transposeChordToken(cleanedText, shift);

          // Draw red transposed chord centered in place
          ctx.fillStyle = '#D32F2F';
          ctx.font = `bold ${Math.max(14, height)}px sans-serif`;
          ctx.textBaseline = 'top';
          ctx.fillText(transposed, bbox.x0, bbox.y0);
        }
      });
    }
  </script>
