<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Transposer</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; margin-bottom: 8px; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.025em;
    }

    .subtitle { color: var(--subtext); font-size: 0.95rem; margin-top: 6px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .drop-zone {
      border: 2px dashed #93c5fd;
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drop-zone:hover { background: #dbeafe; border-color: var(--primary); }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: end;
      margin-top: 16px;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="file"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    select:focus { border-color: var(--primary); }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }

    #status {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: 12px;
      text-align: center;
      min-height: 1.2em;
    }

    .canvas-container {
      display: flex;
      justify-content: center;
      overflow: hidden;
      margin-top: 12px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Chord Screenshot Transposer</h1>
      <p class="subtitle">Upload or paste a song screenshot to automatically transpose chords.</p>
    </header>

    <div class="card">
      <div class="drop-zone" id="dropZone">
        📋 Click to select image, or paste screenshot (Ctrl+V / Cmd+V)
      </div>

      <div class="controls-grid">
        <div class="input-group">
          <label for="imageInput">File Upload</label>
          <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="input-group">
          <label for="semitones">Transpose Key</label>
          <select id="semitones">
            <option value="-5">-5 semitones</option>
            <option value="-4">-4 semitones</option>
            <option value="-3">-3 semitones</option>
            <option value="-2">-2 semitones (-1 step)</option>
            <option value="-1">-1 semitone</option>
            <option value="0" selected>0 (Original Key)</option>
            <option value="1">+1 semitone</option>
            <option value="2">+2 semitones (+1 step)</option>
            <option value="3">+3 semitones</option>
            <option value="4">+4 semitones</option>
            <option value="5">+5 semitones</option>
          </select>
        </div>

        <button id="processBtn" disabled>Scan & Transpose</button>
      </div>

      <div id="status"></div>
    </div>

    <div class="card">
      <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const semitonesSelect = document.getElementById('semitones');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;
    let detectedLines = [];

    // Chord validation regex
    const CHORD_REGEX = /^[A-G][b#]?(?:m|maj|min|dim|aug|sus|add|[0-9])*(?:\/[A-G][b#]?)?$/i;

    // Key Signature regex patterns (Matches: "G调", "F#調", "Key of G", "Key: C#")
    const KEY_ZH_REGEX = /^([A-G][b#]?)\s*(调|調)$/i;
    const KEY_EN_REGEX = /^(Key\s*:?\s*(?:of)?\s*)([A-G][b#]?)$/i;

    function loadImageFromFile(file) {
      if (!file || !file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          processBtn.disabled = false;
          status.innerText = 'Image loaded. Click "Scan & Transpose".';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    dropZone.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => loadImageFromFile(e.target.files[0]));

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          loadImageFromFile(item.getAsFile());
          break;
        }
      }
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFromFile(e.dataTransfer.files[0]);
    });

    processBtn.addEventListener('click', async () => {
      if (!loadedImage) return;

      status.innerText = 'Scanning music sheet...';
      processBtn.disabled = true;

      try {
        const worker = await Tesseract.createWorker(['eng', 'chi_sim', 'chi_tra']);
        const ret = await worker.recognize(loadedImage);
        detectedLines = ret.data.lines || [];
        await worker.terminate();

        status.innerText = 'Transposing chords safely...';
        renderTransposedCanvas();
        status.innerText = 'Done!';
      } catch (err) {
        console.error(err);
        status.innerText = 'Error processing image.';
      } finally {
        processBtn.disabled = false;
      }
    });

    semitonesSelect.addEventListener('change', () => {
      if (detectedLines.length > 0) renderTransposedCanvas();
    });

    function transposeNote(note, shift) {
      const normNote = note.toUpperCase();
      const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const FLATS  = ['C', 'DB', 'D', 'EB', 'E', 'F', 'GB', 'G', 'AB', 'A', 'BB', 'B'];

      let idx = SHARPS.indexOf(normNote);
      if (idx === -1) idx = FLATS.indexOf(normNote);
      if (idx === -1) return note;

      let newIdx = (idx + shift) % 12;
      if (newIdx < 0) newIdx += 12;

      return SHARPS[newIdx];
    }

    function transposeChordToken(chord, shift) {
      return chord.replace(/([A-G][b#]?)/gi, (m) => transposeNote(m, shift));
    }

    function renderTransposedCanvas() {
      if (!loadedImage) return;

      // Reset image to original state
      ctx.drawImage(loadedImage, 0, 0);
      const shift = parseInt(semitonesSelect.value, 10);

      detectedLines.forEach(line => {
        let lineText = line.text ? line.text.trim() : '';
        if (!lineText) return;

        let words = line.words || [];

        // --- FEATURE: DETECT AND TRANSPOSE KEY INDICATORS (e.g. "G调" or "Key of G") ---
        for (let w of words) {
          let wordText = w.text ? w.text.trim() : '';
          
          let zhMatch = KEY_ZH_REGEX.exec(wordText);
          let enMatch = KEY_EN_REGEX.exec(wordText);

          if (zhMatch || enMatch) {
            const bbox = w.bbox;
            const width = bbox.x1 - bbox.x0;
            const height = bbox.y1 - bbox.y0;

            // Mask original key box area
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(bbox.x0 - 2, bbox.y0 - 2, width + 4, height + 4);

            let transposedText = wordText;
            if (zhMatch) {
              const origNote = zhMatch[1];
              const suffix = zhMatch[2];
              transposedText = transposeNote(origNote, shift) + suffix;
            } else if (enMatch) {
              const prefix = enMatch[1];
              const origNote = enMatch[2];
              transposedText = prefix + transposeNote(origNote, shift);
            }

            // Render transposed Key label in red
            ctx.fillStyle = '#D32F2F';
            ctx.font = `bold ${height}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(transposedText, bbox.x0, bbox.y0);
          }
        }

        // SAFEGUARD 1: Skip lyrics lines containing Chinese characters
        if (/[\u4e00-\u9fa5]/.test(lineText)) return;

        if (words.length === 0) return;

        // Clean slash OCR misreads
        let cleanedTokens = words.map(w => {
          let t = w.text ? w.text.trim() : '';
          return t.replace(/([A-G][b#]?)[|I1l\\]([A-G][b#]?)/gi, '$1/$2');
        });

        // SAFEGUARD 2: Count valid chords vs regular non-chord words
        let validChordCount = 0;
        cleanedTokens.forEach(token => {
          if (CHORD_REGEX.test(token)) validChordCount++;
        });

        // Only process line if at least 75% of the words are valid musical chords
        let chordRatio = validChordCount / cleanedTokens.length;
        if (chordRatio < 0.75) return;

        // Process confirmed chord line
        words.forEach((w, idx) => {
          let token = cleanedTokens[idx];

          if (CHORD_REGEX.test(token)) {
            const bbox = w.bbox;
            const width = bbox.x1 - bbox.x0;
            const height = bbox.y1 - bbox.y0;

            if (height > 60 || height < 6) return;

            // Mask original chord
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(bbox.x0 - 2, bbox.y0 - 2, width + 4, height + 4);

            // Transpose chord
            const transposed = (shift === 0) ? token : transposeChordToken(token, shift);

            // Render transposed chord
            ctx.fillStyle = '#D32F2F';
            ctx.font = `bold ${height}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(transposed, bbox.x0, bbox.y0);
          }
        });
      });
    }
  </script>
</body>
</html>
